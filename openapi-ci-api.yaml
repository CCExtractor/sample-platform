  /samples/{sample_id}/history:
    get:
      tags: [Samples]
      summary: Get regression test result history for a sample across runs
      operationId: getSampleHistory
      description: >
        Use failure_signature for flake detection: a stable signature across
        multiple runs on different commits indicates a genuine regression,
        not infrastructure noise.


        Entries cover every regression test on the sample, newest run first,
        so limit counts rows rather than runs. Pass regression_test_id to
        follow one test, where limit then means that many runs of it.


        With status set, the filter runs over a bounded scan of recent
        results; pagination.truncated is true when the sample has more
        history than the scan covered, and total then undercounts.
      security:
        - bearerAuth: []
      x-required-scope: runs:read
      parameters:
        - $ref: "#/components/parameters/SampleId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/RegressionTestIdFilter"
        - $ref: "#/components/parameters/SampleHistoryStatus"
        - $ref: "#/components/parameters/Branch"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/CreatedAfter"
        - $ref: "#/components/parameters/CreatedBefore"
      responses:
        "200":
          description: Paginated sample history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SampleHistoryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /regression-tests:
