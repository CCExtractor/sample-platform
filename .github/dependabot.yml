version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
    time: "10:00"
    timezone: America/Los_Angeles
  open-pull-requests-limit: 10
  reviewers:
  - canihavesomecoffee
  - thealphadollar
- package-ecosystem: npm
  directory: "/web"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      update-types: ["minor", "patch"]
