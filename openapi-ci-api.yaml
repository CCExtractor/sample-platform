                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Sample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /samples/{sample_id}:
    get:
      tags: [Samples]
      summary: Get media sample metadata
      operationId: getSample
      security:
        - bearerAuth: []
      x-required-scope: runs:read
      parameters:
        - $ref: "#/components/parameters/SampleId"
      responses:
        "200":
          description: Media sample metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

    patch:
      tags: [Samples]
      summary: Edit a sample's tags and upload metadata
      operationId: updateSample
      description: >
        Notes, parameters, platform and version live on the upload row
        rather than the sample, so a sample that arrived without one (over
        FTP, or seeded directly) can only have its tags changed and asking
        for the rest returns 409. Tags are given by name.
      security:
        - bearerAuth: []
      x-required-scope: runs:write
      x-required-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/SampleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    maxLength: 64
                notes:
                  type: string
                  maxLength: 1024
                parameters:
                  type: string
                  maxLength: 1024
                platform:
                  type: string
                  enum: [linux, windows, mac, bsd]
                version:
                  type: string
                  maxLength: 10
      responses:
        "200":
          description: Sample updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  sample_id:
                    type: integer
                  tags:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Samples]
      summary: Delete a sample, its extra files and its media info
      operationId: deleteSample
      description: >
        Refused while any regression test still points at the sample,
        because removing the media would leave those tests unable to run and
        their history describing a sample nobody can fetch.
      security:
        - bearerAuth: []
      x-required-scope: runs:write
      x-required-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/SampleId"
      responses:
        "200":
          description: Sample deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  sample_id:
                    type: integer
                  deleted:
                    type: boolean
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /samples/{sample_id}/details:
    get:
      tags: [Samples]
      summary: Get the full detail payload for a media sample
      operationId: getSampleDetails
      description: >
        Extends the summary payload with the upload record, any extra files
        attached to the sample, and the parsed MediaInfo tree. Media info is
        best effort: a sample whose XML is missing or unparseable reports
        null rather than failing the response. Unlike the classic page this
        never regenerates the XML, because a GET must not write to the
        sample repository.
      security:
        - bearerAuth: []
      x-required-scope: runs:read
      parameters:
        - $ref: "#/components/parameters/SampleId"
