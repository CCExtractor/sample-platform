  /regression-tests/{regression_test_id}/outputs/{output_id}/variants/{variant_id}/download:
    get:
      tags: [Regression Tests]
      summary: Locate one of the alternative outputs accepted for a baseline
      operationId: downloadRegressionTestVariant
      security:
        - bearerAuth: []
      x-required-scope: runs:read
      parameters:
        - $ref: "#/components/parameters/RegressionTestId"
        - $ref: "#/components/parameters/OutputId"
        - name: variant_id
          in: path
          required: true
          description: Id of the variant, from the test detail payload
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Where the variant file is stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /regression-tests/{regression_test_id}/outputs/{output_id}/variants:
    post:
      tags: [Regression Tests]
      summary: Accept another output hash as correct for a baseline
      operationId: createRegressionTestVariant
      description: >
        A test can legitimately produce different bytes on different
        platforms or CCExtractor builds. Recording the hash here makes those
        runs pass without overwriting the baseline everyone else is compared
        against, which is what promoting to baseline would do.
      security:
        - bearerAuth: []
      x-required-scope: runs:write
      x-required-roles: [admin, contributor]
      parameters:
        - $ref: "#/components/parameters/RegressionTestId"
        - $ref: "#/components/parameters/OutputId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash]
              properties:
                hash:
                  type: string
                  maxLength: 128
                  pattern: '^[A-Za-z0-9]+$'
      responses:
        "201":
          description: Variant accepted
          content:
            application/json:
              schema:
                type: object
                required: [id, hash]
                properties:
                  id:
                    type: integer
                    minimum: 1
                  hash:
                    type: string
                    maxLength: 128
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
