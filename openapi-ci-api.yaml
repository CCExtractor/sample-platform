        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /samples/{sample_id}/download:
    get:
      tags: [Samples]
      summary: Locate a sample's media file in storage
      operationId: downloadSample
      description: >
        Returns a signed URL rather than the bytes. Samples run to several
        gigabytes, so streaming one through the API would hold a worker for
        the length of the transfer. Where only the local copy exists there is
        no URL to hand out and storage_status reports that instead.
      security:
        - bearerAuth: []
      x-required-scope: runs:read
      parameters:
